name: Release LipatoS Item Move Stack v34.2.7

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v34.2.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify module and regression tests
        run: |
          node --check main.js
          node --check dynamic-weight.js
          node tests/smoke.cjs
          node tests/dynamic-weight.cjs
          node tests/coin-drag.cjs
          node tests/online-transfer.cjs
          node tests/direct-transfer.cjs
          node -e 'const m=require("./module.json");if(m.version!=="34.2.7")process.exit(1);'
      - name: Package Foundry installable module
        run: |
          zip -q lipatos-item-move-stack.zip module.json main.js dynamic-weight.js style.css README.md CHANGELOG.md
          unzip -t lipatos-item-move-stack.zip
      - name: Publish v34.2.7 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v34.2.7 >/dev/null 2>&1; then
            gh release upload v34.2.7 lipatos-item-move-stack.zip module.json --clobber
          else
            gh release create v34.2.7 lipatos-item-move-stack.zip module.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LipatoS — Перемещение и стопки предметов v34.2.7" \
              --notes "Исправлена передача: GM и общие инвентари работают напрямую, для чужих инвентарей GM автоматически исполняет передачу без подтверждения."
          fi
